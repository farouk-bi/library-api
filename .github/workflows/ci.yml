name: CI/CD DevSecOps - library-api

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Nom local de l'image, transmis entre les jobs (sans le nom Docker Hub, qui est un secret)
env:
  IMAGE_LOCAL: library-api:ci

jobs:
  # ---------------------------------------------------------------
  # 1. Gitleaks : recherche de secrets (TP2)
  # ---------------------------------------------------------------
  gitleaks:
    name: 1. Gitleaks - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
  # ---------------------------------------------------------------
  # 2. Trivy fs : librairies vulnerables dans pom.xml (SCA) - NOUVEAU
  # ---------------------------------------------------------------
  dependency-scan:
    name: 2. Trivy fs - dependances (SCA)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Maven dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          output: 'trivy-deps-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Show dependency report
        if: always()
        run: cat trivy-deps-report.txt || true

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: trivy-deps-report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 3. Build Maven + tests unitaires (TP1)
  # ---------------------------------------------------------------
  build:
    name: 3. Build Maven + tests
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/library-api.jar
          retention-days: 1

  # ---------------------------------------------------------------
  # 4. SonarCloud : SAST + Quality Gate bloquant (TP3)
  # ---------------------------------------------------------------
  sonarcloud:
    name: 4. SonarCloud - SAST + Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Tests + JaCoCo coverage report
        run: mvn -B clean verify

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------
  # 5. Docker : build + test du conteneur (TP1 / TP2)
  # ---------------------------------------------------------------
  docker-build-test:
    name: 5. Docker - build + test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: docker build -t "$IMAGE_LOCAL" .

      - name: Test Docker image locally
        run: |
          docker run -d --name library-test -p 8081:8080 "$IMAGE_LOCAL"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null; then break; fi
            sleep 2
          done
          curl -f http://localhost:8081/
          curl -f http://localhost:8081/api/books
          docker rm -f library-test

      - name: Save image as artifact
        run: docker save "$IMAGE_LOCAL" -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------
  # 6. Trivy : CVE de l'image, bloquant (TP2)
  # ---------------------------------------------------------------
  trivy:
    name: 6. Trivy - scan de l'image
    runs-on: ubuntu-latest
    needs: docker-build-test
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Show Trivy report
        if: always()
        run: cat trivy-image-report.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2. Trivy fs : librairies vulnerables dans pom.xml (SCA) - NOUVEAU
  # ---------------------------------------------------------------
  dependency-scan:
    name: 2. Trivy fs - dependances (SCA)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Maven dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          output: 'trivy-deps-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Show dependency report
        if: always()
        run: cat trivy-deps-report.txt || true

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: trivy-deps-report.txt
          if-no-files-found: ignore          
  # ---------------------------------------------------------------
  # 8. Push Docker Hub : seulement si TOUT est vert, sur main (TP1 / TP2)
  # ---------------------------------------------------------------
  push:
    name: 8. Push Docker Hub
    runs-on: ubuntu-latest
    needs: [sonarcloud, trivy]
    if: github.event_name == 'push'
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/library-api
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE_NAME"